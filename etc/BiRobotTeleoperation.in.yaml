---
Managed: false
StepByStep: true
IdleKeepState: false

StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
VerboseStateFactory: false

# mode: SimulationSingle
# mode: SingleVR
mode: DualVR

# human or simple_human
# estimation_module: simple_human
estimation_module: human

# Additional robots to load
robots:
  ground:
    module: env/ground
  robot_1:
    module: HRP4::ImpactGrippers
  robot_2:
    module: RHPS1_forceshoe_forceshoe_lirmm_lirmm

# General constraints, always on
constraints:
- type: contact
  damper: [0.1, 0.01, 0.5]
- type: compoundJoint
- type: kinematics
  robot: robot_2
  damper: [0.1, 0.01, 0.5]
- type: kinematics
  robot: robot_1
  damper: [0.1, 0.01, 0.5]
# - type: dynamics
#   robot: robot_2
# Collision constraint
collisions: []
# collisions:
# - type: collision
#   r1: robot_1
#   r2: robot_1
#   useMinimal: true
# - type: collision
#   r1: robot_2
#   r2: robot_2
#   useMinimal: true

collisions_with_joint_selection:
  rhps1:
    iDist: 0.01
    sDist: 0.005
    simplified_all_bodies: [BODY, HEAD_P_LINK, CHEST_Y_LINK, L_SHOULDER_P_LINK, L_SHOULDER_R_LINK, L_SHOULDER_Y_LINK,
      L_ELBOW_P_LINK, L_WRIST_Y_LINK, L_WRIST_R_LINK, R_SHOULDER_P_LINK, R_SHOULDER_R_LINK, R_SHOULDER_Y_LINK,
      R_ELBOW_Y_LINK, R_WRIST_Y_LINK, R_WRIST_R_LINK, R_CROTCH_P_LINK, L_CROTCH_P_LINK, R_CROTCH_P_LINK,
      R_KNEE_P_LINK, L_KNEE_P_LINK]
    cstr_sets:
    - b1: [L_SHOULDER_Y_LINK, L_ELBOW_P_LINK]
      b2: [R_CROTCH_P_LINK, L_CROTCH_Y_LINK, BODY, HEAD_P_LINK, CHEST_P_LINK]
      joints: [L_SHOULDER_P, L_SHOULDER_R, L_SHOULDER_Y, L_ELBOW_P, L_WRIST_Y, L_WRIST_R]
    - b1: [R_SHOULDER_Y_LINK, R_ELBOW_Y_LINK, R_WRIST_Y_LINK]
      b2: [R_CROTCH_P_LINK, L_CROTCH_Y_LINK, BODY, HEAD_P_LINK, CHEST_P_LINK]
      joints: [R_SHOULDER_P, R_SHOULDER_R, R_SHOULDER_Y, R_ELBOW_P, R_WRIST_Y, R_WRIST_R]
    - b1: [R_ELBOW_Y_LINK]
      b2: [L_ELBOW_P_LINK]
      joints: [R_SHOULDER_P, R_SHOULDER_R, R_SHOULDER_Y, R_ELBOW_P, R_WRIST_Y, R_WRIST_R]
    - b1: [L_CROTCH_P_LINK]
      b2: [R_CROTCH_P_LINK]
      joints: []
  hrp4:
    iDist: 0.01
    sDist: 0.005
    simplified_all_bodies: [body, NECK_P_LINK, torso, L_SHOULDER_P_LINK, L_SHOULDER_R_LINK, L_SHOULDER_Y_LINK,
      L_ELBOW_P_LINK, L_WRIST_Y_LINK, L_WRIST_R_LINK, L_WRIST_P_LINK, R_SHOULDER_P_LINK, R_SHOULDER_R_LINK,
      R_SHOULDER_Y_LINK, R_ELBOW_P_LINK, R_WRIST_Y_LINK, r_wrist, R_WRIST_P_LINK, L_HIP_P_LINK, R_HIP_P_LINK,
      R_KNEE_P_LINK, L_KNEE_P_LINK]
    cstr_sets:
    - b1: [L_SHOULDER_Y_LINK, L_ELBOW_P_LINK, l_wrist]
      b2: [L_HIP_P_LINK, L_HIP_Y_LINK, body, torso]
      joints: [L_SHOULDER_P, L_SHOULDER_R, L_SHOULDER_Y, L_ELBOW_P, L_WRIST_Y, L_WRIST_R, L_WRIST_P]
    - b1: [R_SHOULDER_Y_LINK, R_ELBOW_P_LINK, r_wrist]
      b2: [R_HIP_P_LINK, L_HIP_Y_LINK, body, torso]
      joints: [R_SHOULDER_P, R_SHOULDER_R, R_SHOULDER_Y, R_ELBOW_P, R_WRIST_Y, R_WRIST_R, R_WRIST_P]
    - b1: [R_ELBOW_P_LINK, r_wrist]
      b2: [L_ELBOW_P_LINK, l_wrist]
      joints: [R_SHOULDER_P, R_SHOULDER_R, R_SHOULDER_Y, R_ELBOW_P, R_WRIST_Y, R_WRIST_R, R_WRIST_P]
    - b1: [L_HIP_P_LINK]
      b2: [R_HIP_P_LINK]
      joints: []

contacts:
- r2: ground
  r1: robot_1
  r1Surface: LeftFoot
  r2Surface: AllGround
- r2: ground
  r1: robot_1
  r1Surface: RightFoot
  r2Surface: AllGround
- r2: ground
  r1: robot_2
  r1Surface: LeftFoot
  r2Surface: AllGround
- r2: ground
  r1: robot_2
  r1Surface: RightFoot
  r2Surface: AllGround

# These files are merged with the 'states' element of this FSM configuration
IncludeStates:
- HalfSitting.yaml
- BiRobotTasks.yaml
- ForcesTasks.yaml
- DampingTasks.yaml
- HumanTasks.yaml
- RobotTeleopTasks.yaml
- ForcesDisplay.yaml
- JointsDamping.yaml
- Stabilizer.yaml

# These files are merged with the root element of this FSM configuration
IncludeGlobals:
- RobotLimbMap.yaml
- HumanLimbMap.yaml

states:
  Human::Trajectory:
    base: Parallel
    states:
    - HumanHandTrajTasks

  Human::Free:
    base: Parallel
    states:
    - HumanHandTasks

  Human:
    base: Meta
    transitions:
    - ["Human::ReachPose", OK, "Human::Free", Auto]

  ChoiceMain:
    base: ChooseTransition
    category: []
    actions:
      Start Teleop: TELEOP
      Go halfsit: HALFSIT
    fix_robot: false
    joystick_action: [["Y", "HALFSIT"], ["A", "TELEOP"]] #[button,action]
    robots: ["robot_1", "robot_2"]
    task:
      weight: 00
      stiffness: 20

  ChoiceTeleop:
    base: ChooseTransition
    category: []
    actions:
      Start Bi Robot Teleop: BI-ROBOT-TELEOP
      Cancel: CANCEL
    joystick_action: [["Y", "CANCEL"], ["A", "BI-ROBOT-TELEOP"]]
    fix_robot: false

  ChoiceBiTeleop:
    base: ChooseTransition
    category: []
    actions:
      Cancel: CANCEL
    joystick_action: [["Y", "CANCEL"]]

  BiRobot::Teleop:
    base: Parallel
    states:
    - BiTeleopTask_1
    - BiTeleopTask_2
    # - Forces
    - ChoiceBiTeleop
    delays:
      ChoiceBiTeleop: 0.5

  Robot::Teleop:
    base: Parallel
    states:
    - RobotArm_1
    - RobotArm_2
    # - RobotForearm_1
    # - RobotForearm_2
    - RobotHand_1
    - RobotHand_2

    # - BiTeleop_Damping_1_Hand
    # - BiTeleop_Damping_2_Hand
    # - BiTeleop_Damping_1_Forearm
    # - BiTeleop_Damping_2_Forearm
    # - BiTeleop_Damping_1_Arm
    # - BiTeleop_Damping_2_Arm
    # - JointsDamping_R1_Left
    # - JointsDamping_R2_Left
    # - JointsDamping_R1_Right
    # - JointsDamping_R2_Right


  Teleop::Main:
    base: Meta
    ResetPostures: true
    transitions:
    - [ChoiceMain, HALFSIT, GoHalfSitting, Auto]
    - [GoHalfSitting, OK, ChoiceMain, Auto]
    - [ChoiceMain, TELEOP, "Teleop::Sequence", Auto]
    - ["Teleop::Sequence", CANCEL, ChoiceMain, Auto]

  Teleop::Sequence:
    base: TeleopSequence

    # states for all modes
    states:
    - Robot::Teleop
    - biTeleop::Sequence
#
    # Override states for specific modes
    Mode:
      SimulationSingle:
        states:
        - Robot::Teleop
        - Human   # adds tasks on human robot
        - biTeleop::Sequence
    delays:
      biTeleop::Sequence: 0.5

  biTeleop::Sequence:
    base: Meta
    transitions:
    - [ChoiceTeleop, BI-ROBOT-TELEOP, "BiRobot::Teleop", Auto]
      # - [BiRobot::Teleop, CANCEL, ChoiceTeleop, Auto]
      # - [BiRobot::Teleop, OK, ChoiceTeleop, Auto]

  PostureImitation:
    base: Parallel
    states:
    - RobotArm_1
    # - RobotArm_2
    - RobotForearm_1
    # - RobotForearm_2
    - RobotHand_1
    - RobotHand_2

  MainState:
    base: TeleopSequence

    # Default states (if not specified per-mode)
    states:
    - HumanPoseData_human_2
    - HumanPoseData_human_1
    - HumanEstimation_1
    - HumanEstimation_2
    - Teleop::Main

    robot_1:
      Mode:
        DualVR:
          states:
          - HumanPoseData_human_2
          # - HumanPoseData_human_1
          - HumanEstimation_1
          - HumanEstimation_2
          - Teleop::Main

    robot_2:
      Mode:
        DualVR:
          states:
          # - HumanPoseData_human_2
          - HumanPoseData_human_1
          - HumanEstimation_1
          - HumanEstimation_2
          - Teleop::Main

transitions:
- [BiRobotTeleoperation_Initial, OK, MainState, Auto]
- [PostureImitation, OK, MainState, Strict]

# transitions:
# - [BiRobotTeleoperation_Initial, OK, HandsTask, Strict]
# - [HandsTask, OK, ForceState, Auto]

# Initial state
init: BiRobotTeleoperation_Initial

