MainRobot:
  name: robot_2 # for robot_1
  module: RHPS1 # desired robot module
Enabled: BiRobotTeleoperation

Timestep: 0.005

GUIServer:
  IPC:
    Socket: /tmp/mc_rtc
  TCP:
    # Binding host, * binds to all interfaces
    Host: "*"
    # Binding ports, the first is used for PUB socket and the second for
    # the PULL socket
    Ports: [4242, 4343]
    Timestep: 0.005

server:
  ip: "*"
  sub_port : 4245
  pub_port: 4346

distant_controller:
  ip: localhost #host address of the distant controller
  sub_port : 4242
  pub_port: 4343
  human_name: human_2 #or human_1
  display_human_pose : true
local_controller:
  human_name: human_1 #or human_2
  display_human_pose : true

human_sim:
  active: false #if true the sensor data are overwritten by an external human controller
  ip: localhost #host address of the simulated human controller
  sub_port : 4242
  pub_port: 4343
